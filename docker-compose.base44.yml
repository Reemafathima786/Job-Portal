services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: jobportalpass
      MYSQL_DATABASE: jobportal
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: on-failure

  app:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - .:/app
      - maven_cache:/root/.m2
    ports:
      - "3000:8080"
    environment:
      - DB_URL=jdbc:mysql://db:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=jobportalpass
      - BASE44_PREVIEW_MODE
    command: ["sh", "-ec", "mvn spring-boot:run -Dspring-boot.run.jvmArguments=-Dserver.port=8080"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/jobs > /dev/null 2>&1 || wget -q -O /dev/null http://localhost:8080/api/jobs 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: on-failure

volumes:
  db_data:
  maven_cache:
